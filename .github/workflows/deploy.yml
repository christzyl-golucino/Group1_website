name: Group Project CI/CD SFTP Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify HTML files and structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html

          shopt -s nullglob
          for file in *.html; do
            grep -qi "<html" "$file" || {
              echo "Invalid HTML structure in $file"
              exit 1
            }
          done

  deploy-to-server:
    needs: validate-code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        shell: bash
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SFTP_USER:?SFTP_USER is missing}"
          : "${SFTP_HOST:?SFTP_HOST is missing}"
          : "${SFTP_PASSWORD:?SFTP_PASSWORD is missing}"

      - name: Transfer Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: "."
          remote_path: "/home/lsu-source-fandemic/htdocs/fandemic.lsu-source.org/"
          args: "-o ConnectTimeout=30 -o StrictHostKeyChecking=no"