name: Group Project CI/CD SFTP Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # STEP 1: Continuous Integration (test code on pushes and pull requests)
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify HTML Files Exist and Validate Structure
        run: |
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html found."
          else
            echo "ERROR: index.html is missing!"
            exit 1
          fi

          # Checks all HTML files in the repository root for basic structure
          for file in *.html; do
            if [ -f "$file" ]; then
              if grep -iq "<html" "$file"; then
                echo "Validated structure for $file"
              else
                echo "Invalid HTML structure in $file"
                exit 1
              fi
            fi
          done

  # STEP 2: Continuous Deployment (runs ONLY when code is pushed/merged to main)
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: validate-code # Ensures tests pass before deploying
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # Replaces manual WinSCP drag-and-drop by uploading via SFTP
      - name: Transfer Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: "./"
          remote_path: "/home/lsu-source-fandemic/htdocs/fandemic.lsu-source.org/"
          sftp_only: true